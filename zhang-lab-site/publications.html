<!DOCTYPE html>

<style>
:root {
    --primary: #102542;
    --accent: #2952A3;
    --light: #f8fafc;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: #f7f9fc;
    color: var(--text);
    line-height: 1.7;
}

.container {
    width: 90%;
    max-width: 1200px;
    margin: auto;
}



.controls {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin: 30px 0;
}

.search-box,
.filter-box,
.sort-box {
    flex: 1;
    min-width: 220px;
}

input,
select {
    width: 100%;
    padding: 14px 18px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: white;
    font-size: 15px;
    transition: 0.2s ease;
}

input:focus,
select:focus {
    outline: none;
    border-color: var(--accent);
}

.stats {
    margin-bottom: 25px;
    color: var(--muted);
    font-size: 15px;
}

.publication-card {
    background: white;
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    transition: all .25s ease;
}

.publication-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 14px 35px rgba(15,23,42,0.08);
}

.pub-year {
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 10px;
    font-size: .95rem;
}

.pub-title {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 10px;
}

.pub-authors {
    color: var(--muted);
    margin-bottom: 12px;
}

.pub-journal {
    font-style: italic;
    color: #334155;
}

footer {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    margin-top: 50px;
}

.no-results {
    text-align: center;
    color: var(--muted);
    padding: 50px;
    display: none;
}

@media (max-width: 768px) {
    .controls {
        flex-direction: column;
    }

    .header-content h1 {
        font-size: 2rem;
    }

    .publication-card {
        padding: 22px;
    }
}
</style>
</head>

  
<section class="publications-library">

      <option value="oldest">Oldest First</option>

</section>

const container = document.getElementById("publicationsContainer");
const searchInput = document.getElementById("publicationSearch");
const sortSelect = document.getElementById("sortPublications");

function renderPublications() {
  const searchTerm = searchInput.value.toLowerCase();
  const sortType = sortSelect.value;

  let filtered = publications.filter(pub =>
    pub.title.toLowerCase().includes(searchTerm) ||
    pub.authors.toLowerCase().includes(searchTerm) ||
    pub.year.toString().includes(searchTerm)
  );

  filtered.sort((a, b) =>
    sortType === "newest"
      ? b.year - a.year
      : a.year - b.year
  );

  container.innerHTML = "";

  filtered.forEach(pub => {
    container.innerHTML += `
      <div class="publication-card">
        <div class="year-badge">${pub.year}</div>

        <div class="publication-title">
          ${pub.title}
        </div>

        <div class="publication-authors">
          <strong>Authors:</strong> ${pub.authors}
        </div>

        <a href="${pub.link}" target="_blank" class="publication-link">
          Read Publication
        </a>
      </div>
    `;
  });
}

searchInput.addEventListener("input", renderPublications);
sortSelect.addEventListener("change", renderPublications);

renderPublications();
