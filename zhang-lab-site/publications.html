function renderPublications(filter = "") {
  const container = document.getElementById("publicationsList");
  container.innerHTML = "";

  const filtered = publications.filter(pub =>
    pub.title.toLowerCase().includes(filter.toLowerCase()) ||
    pub.authors.toLowerCase().includes(filter.toLowerCase()) ||
    pub.journal.toLowerCase().includes(filter.toLowerCase()) ||
    pub.year.toString().includes(filter)
  );

  filtered.forEach(pub => {
    const div = document.createElement("div");
    div.className = "publication";

    div.innerHTML = `
      <p class="pub-title">${pub.title}</p>
      <p class="pub-authors">${pub.authors}</p>
      <p class="pub-journal">${pub.journal}</p>
      <a href="${pub.link}" target="_blank">View Publication</a>
    `;

    container.appendChild(div);
  });
}

renderPublications();

document.getElementById("pubSearch").addEventListener("input", (e) => {
  renderPublications(e.target.value);
});
